name: Build JK BMS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APKs (Release & Debug)
        run: |
          set -o pipefail
          ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Dump Failure Logs
        if: failure()
        run: |
          echo "=== COMPILATION ERRORS ==="
          grep -E -C 2 "e: |error:|FAILED" build.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "### Build Failure" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Upload Release APK (Signed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JK-BMS-DualMonitor-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JK-BMS-DualMonitor-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
