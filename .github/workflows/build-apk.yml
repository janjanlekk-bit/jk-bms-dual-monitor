name: Build JK BMS APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APKs (Release & Debug)
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease assembleDebug -PversionCode=${{ github.run_number }} --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Dump Failure Logs
        if: failure()
        run: |
          echo "=== COMPILATION ERRORS ==="
          grep -E -C 2 "e: |error:|FAILED" build.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "### Build Failure" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build.log

      - name: Upload Release APK (Signed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JK-BMS-DualMonitor-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JK-BMS-DualMonitor-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Set up Python for PlatformIO
        if: success()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        if: success()
        continue-on-error: true
        run: pip install platformio

      - name: Build ESP32 Firmware
        id: build_esp32
        if: success()
        continue-on-error: true
        run: |
          cd esp32_firmware
          pio run

      - name: Upload ESP32 Firmware Artifact
        if: steps.build_esp32.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: JK-BMS-ESP32-Firmware
          path: esp32_firmware/.pio/build/esp32dev/firmware.bin
          retention-days: 14

      - name: Publish GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: "JK BMS Dual Monitor v0.1.${{ github.run_number }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            esp32_firmware/.pio/build/esp32dev/firmware.bin
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


